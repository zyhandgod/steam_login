<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <style>
      body {
        margin: 0;
        background: #101827;
        color: #eef3ff;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      header {
        height: 108px;
        box-sizing: border-box;
        padding: 18px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #28364a;
      }
      h3 {
        margin: 0 0 9px;
        font-size: 17px;
      }
      p {
        margin: 0;
        color: #b0bdd1;
        font-size: 13px;
        max-width: 740px;
      }
      button {
        cursor: pointer;
        border: 1px solid #3f536e;
        border-radius: 7px;
        background: #20324c;
        color: white;
        padding: 9px 14px;
        margin-left: 8px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h3 id="title">正在准备查询…</h3>
        <p id="message">
          查询标识 将自动填写，请在网页中点击查询；结果会自动保存。
        </p>
      </div>
      <div>
        <button id="retry">重试</button><button id="skip">跳过</button
        ><button id="cancel">结束</button>
      </div>
    </header>
    <script src="query-toolbar.js"></script>
  </body>
</html>
