name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore -r win-x64
      - run: dotnet restore tests/ParserSmoke/ParserSmoke.csproj
      - run: dotnet run --project tests/ParserSmoke/ParserSmoke.csproj
      - run: dotnet publish SteamLoginLite.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SteamLoginLite-win-x64
          path: publish/win-x64/**
